<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病理診断レポート - Option 2</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:100%; font-family: Arial, "Yu Gothic", Meiryo, sans-serif; font-size:14px; }
  body { background:#eef3f7; color:#111; overflow-x:auto; }

  :root{
    --blue:#5a9bd0;
    --blue-dark:#468ec6;
    --blue-light:#dbeaf6;
    --blue-mid:#9bc4e5;
    --gray:#777;
    --white:#fff;
  }

  .app { min-width:1100px; }
  .topbar {
    height:30px; background:#333; color:#fff; display:flex; align-items:center;
    padding:0 10px; font-weight:bold;
  }
  .topbar .title { flex:1; }
  .top-actions button{
    border:1px solid #888; background:#555; color:#fff; padding:3px 10px;
    margin-left:5px; cursor:pointer;
  }

  .layout{
    display:grid;
    grid-template-columns: minmax(650px, 1fr) minmax(390px, 520px);
    gap:8px;
    padding:6px;
    align-items:start;
  }

  .nav{
    background:#30373c; color:#fff; min-height:calc(100vh - 42px);
  }
  .nav-title{ padding:8px; font-weight:bold; border-bottom:1px solid #555; }
  .nav-item{ padding:7px 8px; border-bottom:1px solid #555; font-size:12px; }
  .nav-item.active{ background:#198fc7; }

  .main, .side { min-width:0; }
  .page-head{
    background:#fff; border:1px solid #ddd; padding:8px 10px; margin-bottom:6px;
  }
  .page-no{ font-size:10px; color:#4489bb; }
  .page-title{ font-size:16px; font-weight:bold; margin-top:3px; }

  .section{
    margin-bottom:7px; border:1px solid #b8d2e6; background:var(--blue-light);
  }
  .section-title{
    height:25px; background:var(--blue); color:#fff; display:flex; align-items:center;
    padding:0 8px; font-weight:bold;
  }
  .section-body{ padding:7px; }

  /* Option 2: input table + calculation/information are side by side */
  .option2-grid{
    display:grid;
    grid-template-columns:minmax(360px, 0.40fr) minmax(520px, 0.60fr);
    gap:12px;
    align-items:start;
  }
  .option2-left,.option2-right{min-width:0;}

  /* Option 2 input table */
  .option2-table{
    width:100%; border-collapse:collapse; table-layout:fixed;
    background:var(--blue-light);
  }
  .option2-table th{
    background:var(--blue); color:#fff; height:27px; padding:4px 7px; text-align:left;
    font-weight:bold;
  }
  .option2-table td{
    height:28px; padding:0 7px; border-bottom:1px solid rgba(255,255,255,.45);
  }
  .option2-table .label{ width:120px; }
  .option2-table .count{ width:145px; }
  .option2-table .count2{ width:145px; }
  .option2-table .name{ width:150px; }

  .option2-table tr:nth-child(odd) td{ background:#dbeaf6; }
  .option2-table tr:nth-child(even) td{ background:#cfe3f2; }
  .option2-table .dark td{ background:#9bc4e5 !important; color:#111; }

  .cell-input{
    width:100%; height:25px; border:1px solid transparent; outline:none;
    background:#eef5fa; padding:2px 5px; font-size:14px;
    color:#111;
  }
  .cell-input:focus{ border:2px solid #2e7d32; background:#fff; }

  .calc{
    width:100%; border-collapse:collapse; table-layout:fixed; background:var(--blue-light);
  }
  .calc td{ height:42px; padding:5px 8px; }
  .calc .calc-label{
    width:72px; background:var(--blue); color:#fff; font-weight:bold;
  }
  .calc .calc-value{ background:#dbeaf6; }
  .calc .calc-head-cell{background:var(--blue); color:#fff; font-weight:bold; height:27px; padding:4px 7px;}
  .calc .calc-head td{height:27px;}
  .calc input{
    width:100%; border:1px solid transparent; background:#eef5fa; height:27px;
    padding:3px 6px; color:#111;
  }
  .calc .calc-inline-input{width:72px; display:inline-block; vertical-align:middle; margin-left:6px;}
  .calc .calc-formula{width:100%;}

  .note-row{
    display:flex; gap:12px; align-items:stretch; margin-top:10px;
  }
  .note{
    flex:1; min-height:70px; background:#9bc4e5; padding:8px; line-height:1.45;
  }
  .clear-btn{
    width:190px; align-self:center; height:42px; border:0; background:#808080;
    color:#fff; font-size:15px; cursor:pointer;
  }

  /* Right side: permanent finding + reporting */
  .side{
    position:sticky; top:6px;
  }
  .side-section{
    background:var(--blue-light); border:1px solid #b8d2e6; margin-bottom:8px;
  }
  .side-title{
    background:var(--blue-dark); color:#fff; height:28px; display:flex; align-items:center;
    padding:0 8px; font-weight:bold;
  }
  .side-body{
    min-height:210px; padding:8px; white-space:nowrap; overflow:hidden;
  }
  .side-section.finding .side-body{ min-height:260px; }
  .side-section.reporting .side-body{ min-height:330px; }

  .side-copy{
    float:right; margin-top:12px; background:#808080; color:#fff; border:0;
    padding:8px 28px; cursor:pointer;
  }

  .ref-line{
    white-space:nowrap; line-height:1.65; overflow:hidden; text-overflow:clip;
  }
  .empty{ color:transparent; }

  @media (max-width: 1250px){
    .layout{ grid-template-columns:minmax(620px,1fr) minmax(350px,430px); }
    .side-body{ font-size:12px; }
    .option2-grid{grid-template-columns:minmax(320px,0.40fr) minmax(480px,0.60fr); gap:8px;}
  }
</style>

<style id="option2-final-100-30-30-40">
/* =========================================================
   OPTION 2 — FINAL LAYOUT
   100% viewport = 30% Input + 30% Information + 40% Report
   No gap.
   Input + Information scroll together.
   ========================================================= */

*, *::before, *::after {
  box-sizing:border-box !important;
}

html, body {
  width:100vw !important;
  max-width:100vw !important;
  min-width:0 !important;
  margin:0 !important;
  padding:0 !important;
}

body {
  overflow-x:hidden !important;
  overflow-y:hidden !important;
}

/* Hide navigation only. */
.nav,
.nav-column,
.navigation,
nav {
  display:none !important;
}

/* Full viewport: 60% left + 40% report */
.app {
  width:100vw !important;
  max-width:100vw !important;
  min-width:0 !important;
  height:100vh !important;
  min-height:100vh !important;

  display:grid !important;
  grid-template-columns:60vw 40vw !important;
  grid-template-rows:100vh !important;

  gap:0 !important;
  column-gap:0 !important;
  row-gap:0 !important;

  margin:0 !important;
  padding:0 !important;
  overflow:hidden !important;
}

/* LEFT 60% shared scrolling container */
.main,
.center,
.content {
  width:60vw !important;
  min-width:60vw !important;
  max-width:60vw !important;
}

/* Use whichever actual left container exists without
   changing its original content. */
.main {
  grid-column:1 !important;
  height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
}

/* 30% INPUT */
.input-area,
.input-column,
.left {
  width:30vw !important;
  min-width:30vw !important;
  max-width:30vw !important;
  margin:0 !important;
  box-sizing:border-box !important;
}

/* 30% INFORMATION */
.info-area,
.info-column,
.info {
  width:30vw !important;
  min-width:30vw !important;
  max-width:30vw !important;
  margin:0 !important;
  box-sizing:border-box !important;
}

/* If Input and Info share a wrapper, make that wrapper 60%
   and split it exactly 30/30. */
.workspace,
.content-grid {
  width:60vw !important;
  min-width:60vw !important;
  max-width:60vw !important;

  display:grid !important;
  grid-template-columns:30vw 30vw !important;

  gap:0 !important;
  column-gap:0 !important;
  row-gap:0 !important;

  margin:0 !important;
  padding:0 !important;
  align-items:start !important;
}

/* RIGHT 40% REPORT/FINDING */
.report,
.report-column,
.right {
  grid-column:2 !important;
  width:40vw !important;
  min-width:40vw !important;
  max-width:40vw !important;
  height:100vh !important;
  min-height:100vh !important;

  margin:0 !important;
  padding:0 !important;

  position:sticky !important;
  top:0 !important;
  overflow:hidden !important;

  box-sizing:border-box !important;
}

/* Report/finding content fills the 40%. */
.report > *,
.report-column > *,
.right > * {
  max-width:100% !important;
  box-sizing:border-box !important;
}

/* Remove outer layout gaps only. */
.app,
.main,
.workspace,
.content-grid,
.report,
.report-column,
.right {
  gap:0 !important;
  column-gap:0 !important;
  row-gap:0 !important;
}

/* Desktop hard lock */
@media (min-width:901px) {
  .app {
    width:100vw !important;
    grid-template-columns:60vw 40vw !important;
  }

  .workspace,
  .content-grid {
    width:60vw !important;
    grid-template-columns:30vw 30vw !important;
  }

  .input-area,
  .input-column,
  .left {
    width:30vw !important;
    max-width:30vw !important;
  }

  .info-area,
  .info-column,
  .info {
    width:30vw !important;
    max-width:30vw !important;
  }

  .report,
  .report-column,
  .right {
    width:40vw !important;
    max-width:40vw !important;
  }
}
</style>


<style id="option2-correct-viewport-layout">

   The previous error was applying the 60/40 grid to .app,
   while .app also contains .topbar and .layout.
   The actual 60/40 split must be applied to .layout.
   Inside .main, .option2-grid is the actual 30/30 split.
   ========================================================= */

}

html, body {
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;

  padding:0 !important;
}

body {

  overflow-y:hidden !important;
}

/* Keep the app as a normal full-width wrapper.
   DO NOT make .app itself the 60/40 grid because it contains .topbar. */

  width:100vw !important;
  max-width:100vw !important;
  min-width:0 !important;
  height:100vh !important;
  min-height:100vh !important;
  margin:0 !important;
  padding:0 !important;
  display:block !important;
  overflow:hidden !important;
}

/* The top bar spans the complete viewport. */

  max-width:100vw !important;
  min-width:0 !important;
  height:30px !important;

}

/* THIS is the actual 100% layout container. */

  max-width:100vw !important;

  height:calc(100vh - 30px) !important;

  display:grid !important;
  grid-template-columns:60vw 40vw !important;

}

}

/* INPUT = EXACT 30% */

}

/* INFORMATION = EXACT 30% */
.app > .layout > .main .option2-grid > .option2-right {
  grid-column:2 !important;

  width:30vw !important;
  min-width:30vw !important;
  max-width:30vw !important;

  margin:0 !important;
  padding:0 !important;

  overflow:visible !important;
}

/* Remove old min-width constraints that caused unused/black space. */
.app > .layout > .main,
.app > .layout > .main .option2-grid,
.app > .layout > .main .option2-left,

/* Tables fill their assigned columns, not create a fourth space. */

  grid-row:1 !important;

  width:40vw !important;
  min-width:40vw !important;

/* No outer gap anywhere. */

<body>
<div class="app">
  <div class="topbar">
    <div class="title">病理診断レポート</div>
    <div class="top-actions">
      <button onclick="clearAll()">入力データを消す</button>
      <button onclick="copyReport()">レポートをコピー</button>
    </div>
  </div>

  <div class="layout">
<main class="main">
      <div class="page-head">
        <div class="page-no">PAGE 2 / 26</div>
        <div class="page-title">領域横断的癌取扱い規約</div>
      </div>

      <section class="section">
        <div class="section-title">領域横断的癌取扱い規約　第1版　2019</div>
        <div class="section-body">
          <div class="option2-grid">
            <div class="option2-left">
              <table class="option2-table" id="inputTable">
            <thead>
              <tr>
                <th class="label">番号</th>
                <th class="count">転移数</th>
                <th class="count2">非消数</th>

            </thead>
            <tbody>
              <tr><td>Lt</td><td><input class="cell-input" data-key="Lt_転移数"></td><td><input class="cell-input" data-key="Lt_非消数"></td><td><input class="cell-input" data-key="Lt_名称" value="左側"></td></tr>
              <tr><td>Rt</td><td><input class="cell-input" data-key="Rt_転移数"></td><td><input class="cell-input" data-key="Rt_非消数"></td><td><input class="cell-input" data-key="Rt_名称" value="右側"></td></tr>
              <tr><td>#1</td><td><input class="cell-input" data-key="#1_転移数"></td><td><input class="cell-input" data-key="#1_非消数"></td><td><input class="cell-input" data-key="#1_名称"></td></tr>
              <tr><td>#2</td><td><input class="cell-input" data-key="#2_転移数"></td><td><input class="cell-input" data-key="#2_非消数"></td><td><input class="cell-input" data-key="#2_名称"></td></tr>
              <tr><td>#3</td><td><input class="cell-input" data-key="#3_転移数"></td><td><input class="cell-input" data-key="#3_非消数"></td><td><input class="cell-input" data-key="#3_名称"></td></tr>
              <tr><td>#4</td><td><input class="cell-input" data-key="#4_転移数"></td><td><input class="cell-input" data-key="#4_非消数"></td><td><input class="cell-input" data-key="#4_名称"></td></tr>
              <tr><td>#5</td><td><input class="cell-input" data-key="#5_転移数"></td><td><input class="cell-input" data-key="#5_非消数"></td><td><input class="cell-input" data-key="#5_名称"></td></tr>
              <tr><td>A</td><td><input class="cell-input" data-key="A_転移数"></td><td><input class="cell-input" data-key="A_非消数"></td><td><input class="cell-input" data-key="A_名称"></td></tr>
              <tr><td>B</td><td><input class="cell-input" data-key="B_転移数"></td><td><input class="cell-input" data-key="B_非消数"></td><td><input class="cell-input" data-key="B_名称"></td></tr>
              <tr><td>C</td><td><input class="cell-input" data-key="C_転移数"></td><td><input class="cell-input" data-key="C_非消数"></td><td><input class="cell-input" data-key="C_名称"></td></tr>
              <tr><td>D</td><td><input class="cell-input" data-key="D_転移数"></td><td><input class="cell-input" data-key="D_非消数"></td><td><input class="cell-input" data-key="D_名称"></td></tr>

              UICC/TNM分類第8版<br>
              <span>すべてのリンパ節内転移巣が0.2cm以下の場合は(mi)を付記して表記する</span>

            </div>
          </div>
        </div>
      </section>
    </main>

    <aside class="side">
      <section class="side-section finding">
        <div class="side-title">◇ 所見 / Finding</div>
        <div class="side-body" id="finding">
          <!-- Nothing is shown until the user enters data. -->
        </div>
      </section>

      <section class="side-section reporting">
        <div class="side-title">◇ 報告 / Reporting</div>
        <div class="side-body" id="reporting">
          <!-- Nothing is shown until the user enters data. -->
        </div>
      </section>
    </aside>
  </div>
</div>

<script>
const inputs = [...document.querySelectorAll('.cell-input')];
const calcInputs = [...document.querySelectorAll('[data-calc]')];

function collectValues(){
  return inputs.map(i => ({
    key:i.dataset.key,
    value:i.value.trim()
  })).filter(x => x.value !== '');
}

function render(){
  const values = collectValues();
  const finding = document.getElementById('finding');
  const reporting = document.getElementById('reporting');

  // No selection/input => keep both boxes completely blank.
  if(!values.length){
    finding.innerHTML = '';
    reporting.innerHTML = '';
    return;
  }

  // Single-line reflection: no unnecessary line breaks.
  const inline = values.map(x => `${x.key.replace('_',' ')} ${x.value}`).join('　');
  finding.innerHTML = `<div class="ref-line">${escapeHtml(inline)}</div>`;

  // Reporting uses the same entered values, without inserting line breaks.
  reporting.innerHTML = `<div class="ref-line">${escapeHtml(inline)}</div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

inputs.forEach(i => i.addEventListener('input', render));

function clearAll(){
  inputs.forEach(i => i.value = '');
  calcInputs.forEach(i => i.value = '');
  document.getElementById('finding').innerHTML = '';
  document.getElementById('reporting').innerHTML = '';
}

function copyReport(){
  const text = [document.getElementById('finding').innerText,
                document.getElementById('reporting').innerText].filter(Boolean).join(' ');
  if(text) navigator.clipboard?.writeText(text);
}

render();
</script>
</body>
</html>
